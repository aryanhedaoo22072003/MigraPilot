services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      retries: 10
      timeout: 5s

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  shadow-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shadow_migrapilot
      POSTGRES_USER: shadow_loader
      POSTGRES_PASSWORD: ${SHADOW_LOADER_PASSWORD:-shadow-loader-local-only}
      SHADOW_EXECUTOR_PASSWORD: ${SHADOW_EXECUTOR_PASSWORD:-shadow-executor-local-only}
    volumes:
      - shadow_postgres_data:/var/lib/postgresql/data
      - ./shadow-db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - shadow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shadow_loader -d shadow_migrapilot"]
      interval: 5s
      retries: 15
      timeout: 5s

  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-5}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-4096}
      AI_CONVERSION_RATE_LIMIT_PER_MINUTE: ${AI_CONVERSION_RATE_LIMIT_PER_MINUTE:-5}
      AI_AUTOPSY_RATE_LIMIT_PER_MINUTE: ${AI_AUTOPSY_RATE_LIMIT_PER_MINUTE:-3}
      AI_PROVIDER_TIMEOUT_SECONDS: ${AI_PROVIDER_TIMEOUT_SECONDS:-60}
      AI_PROVIDER_MAX_RETRIES: ${AI_PROVIDER_MAX_RETRIES:-1}
      AI_AUTOPSY_REQUEST_BUDGET_SECONDS: ${AI_AUTOPSY_REQUEST_BUDGET_SECONDS:-45}
      AI_AUTOPSY_TASK_SOFT_LIMIT_SECONDS: ${AI_AUTOPSY_TASK_SOFT_LIMIT_SECONDS:-60}
      AI_AUTOPSY_TASK_HARD_LIMIT_SECONDS: ${AI_AUTOPSY_TASK_HARD_LIMIT_SECONDS:-70}
      AI_AUTOPSY_STALE_AFTER_SECONDS: ${AI_AUTOPSY_STALE_AFTER_SECONDS:-300}
      MASK_PII: ${MASK_PII:-true}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
      MAX_ZIP_FILES: ${MAX_ZIP_FILES:-50}
      MAX_ZIP_UNCOMPRESSED_BYTES: ${MAX_ZIP_UNCOMPRESSED_BYTES:-52428800}
      AUTOPSY_MAX_SQL_CHARS: ${AUTOPSY_MAX_SQL_CHARS:-50000}
      AUTOPSY_MAX_EXPRESSION_CHARS: ${AUTOPSY_MAX_EXPRESSION_CHARS:-2000}
      AUTOPSY_MAX_TRANSFORMATIONS: ${AUTOPSY_MAX_TRANSFORMATIONS:-100}
      AUTOPSY_MAX_PORTS: ${AUTOPSY_MAX_PORTS:-500}
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./api:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./api
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-5}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-4096}
      AI_CONVERSION_RATE_LIMIT_PER_MINUTE: ${AI_CONVERSION_RATE_LIMIT_PER_MINUTE:-5}
      AI_AUTOPSY_RATE_LIMIT_PER_MINUTE: ${AI_AUTOPSY_RATE_LIMIT_PER_MINUTE:-3}
      AI_PROVIDER_TIMEOUT_SECONDS: ${AI_PROVIDER_TIMEOUT_SECONDS:-60}
      AI_PROVIDER_MAX_RETRIES: ${AI_PROVIDER_MAX_RETRIES:-1}
      AI_AUTOPSY_REQUEST_BUDGET_SECONDS: ${AI_AUTOPSY_REQUEST_BUDGET_SECONDS:-45}
      AI_AUTOPSY_TASK_SOFT_LIMIT_SECONDS: ${AI_AUTOPSY_TASK_SOFT_LIMIT_SECONDS:-60}
      AI_AUTOPSY_TASK_HARD_LIMIT_SECONDS: ${AI_AUTOPSY_TASK_HARD_LIMIT_SECONDS:-70}
      AI_AUTOPSY_STALE_AFTER_SECONDS: ${AI_AUTOPSY_STALE_AFTER_SECONDS:-300}
      MASK_PII: ${MASK_PII:-true}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
      MAX_ZIP_FILES: ${MAX_ZIP_FILES:-50}
      MAX_ZIP_UNCOMPRESSED_BYTES: ${MAX_ZIP_UNCOMPRESSED_BYTES:-52428800}
      SHADOW_LOADER_URL: postgresql://shadow_loader:${SHADOW_LOADER_PASSWORD:-shadow-loader-local-only}@shadow-db:5432/shadow_migrapilot
      SHADOW_EXECUTOR_URL: postgresql://shadow_executor:${SHADOW_EXECUTOR_PASSWORD:-shadow-executor-local-only}@shadow-db:5432/shadow_migrapilot
      SHADOW_STATEMENT_TIMEOUT_MS: ${SHADOW_STATEMENT_TIMEOUT_MS:-5000}
      SHADOW_JOB_TIMEOUT_SECONDS: ${SHADOW_JOB_TIMEOUT_SECONDS:-30}
      SHADOW_MAX_ROWS: ${SHADOW_MAX_ROWS:-1000}
      SHADOW_MISMATCH_SAMPLE_LIMIT: ${SHADOW_MISMATCH_SAMPLE_LIMIT:-25}
      SHADOW_DECIMAL_TOLERANCE: ${SHADOW_DECIMAL_TOLERANCE:-0.0001}
      AUTOPSY_MAX_SQL_CHARS: ${AUTOPSY_MAX_SQL_CHARS:-50000}
      AUTOPSY_MAX_EXPRESSION_CHARS: ${AUTOPSY_MAX_EXPRESSION_CHARS:-2000}
      AUTOPSY_MAX_TRANSFORMATIONS: ${AUTOPSY_MAX_TRANSFORMATIONS:-100}
      AUTOPSY_MAX_PORTS: ${AUTOPSY_MAX_PORTS:-500}
    command: celery -A app.worker.celery_app.celery_app worker --loglevel=info
    volumes:
      - ./api:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      shadow-db:
        condition: service_healthy
    networks:
      - default
      - shadow

  web:
    build: ./web
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./web:/app
      - /app/node_modules
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
    depends_on:
      - api

volumes:
  postgres_data:
  shadow_postgres_data:

networks:
  shadow:
    internal: true
