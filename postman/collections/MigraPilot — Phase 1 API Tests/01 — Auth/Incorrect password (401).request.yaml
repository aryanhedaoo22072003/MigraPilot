$kind: http-request
url: "{{base_url}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{test_email}}",
      "password": "wrong-password"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: 'pm.test("Incorrect password (401): HTTP 401", function () { pm.response.to.have.status(401); });'
    language: text/javascript
order: 5000
