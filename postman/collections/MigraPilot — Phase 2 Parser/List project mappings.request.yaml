$kind: http-request
url: "{{base_url}}/projects/{{project_id}}/mappings"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Mappings returned', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.expect(body).to.be.an('array').that.is.not.empty;
      pm.environment.set('mapping_id', body[body.length - 1].id);
    language: text/javascript
order: 3000
